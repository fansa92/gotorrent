name: Release

# 推送 v* 标签即触发多架构交叉编译与 GitHub Release 发布。
on:
  push:
    tags:
      - "v*"
  # 手动触发仅做构建验证,不会发布 Release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, arch: amd64 }
          - { goos: linux, goarch: arm64, arch: arm64 }
          - { goos: linux, goarch: "386", arch: "386" }
          - { goos: linux, goarch: arm, goarm: "7", arch: armv7 }
          - { goos: linux, goarch: arm, goarm: "6", arch: armv6 }
          # 以下大端/小端架构由 modernc.org/sqlite 的预生成文件覆盖
          - { goos: linux, goarch: ppc64le, arch: ppc64le }
          - { goos: linux, goarch: riscv64, arch: riscv64 }
          - { goos: linux, goarch: s390x, arch: s390x }
          - { goos: windows, goarch: amd64, arch: amd64 }
          # Windows/386 不支持:间接依赖 modernc.org/sqlite v1.21.1 未提供 386 的构建定义
          - { goos: windows, goarch: arm64, arch: arm64 }
          # loong64 / dragonfly / solaris / aix 同样因该依赖缺少平台文件而暂不提供
          - { goos: darwin, goarch: amd64, arch: amd64 }
          - { goos: darwin, goarch: arm64, arch: arm64 }
          - { goos: freebsd, goarch: amd64, arch: amd64 }
          - { goos: freebsd, goarch: arm64, arch: arm64 }
          - { goos: freebsd, goarch: "386", arch: "386" }
          - { goos: freebsd, goarch: arm, goarm: "7", arch: armv7 }
          # NetBSD / OpenBSD 不支持:anacrolix/torrent v1.61.0 的 storage/sys_unix.go
          # 使用 unix.SEEK_DATA,而 golang.org/x/sys 在这两个平台未定义该常量
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译并打包
        id: pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="gotorrent_${VERSION}_${GOOS}_${{ matrix.arch }}"
          STAGE="staging/${NAME}"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"

          mkdir -p "$STAGE"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${STAGE}/gotorrent${EXT}" .
          cp README.md "$STAGE/"

          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd staging && zip -qr "../dist/${NAME}.zip" "$NAME")
            echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "dist/${NAME}.tar.gz" -C staging "$NAME"
            echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gotorrent-${{ matrix.goos }}-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  universal:
    name: 合并 macOS 通用二进制
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gotorrent-darwin-amd64
          path: dmgs/amd64

      - uses: actions/download-artifact@v4
        with:
          pattern: gotorrent-darwin-arm64
          path: dmgs/arm64

      - name: lipo 合并并打包
        id: pack
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p x64 arm64 staging
          tar -xzf dmgs/amd64/*.tar.gz -C x64
          tar -xzf dmgs/arm64/*.tar.gz -C arm64
          AMD_BIN="$(find x64 -type f -name gotorrent | head -1)"
          ARM_BIN="$(find arm64 -type f -name gotorrent | head -1)"
          README="$(find x64 -type f -name README.md | head -1)"
          NAME="gotorrent_${VERSION}_darwin_universal"
          mkdir -p "staging/${NAME}"
          lipo -create "$AMD_BIN" "$ARM_BIN" -o "staging/${NAME}/gotorrent"
          chmod +x "staging/${NAME}/gotorrent"
          cp "$README" "staging/${NAME}/"
          tar -czf "${NAME}.tar.gz" -C staging "$NAME"
          echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gotorrent-darwin-universal
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    name: 发布 Release
    if: github.event_name == 'push'
    needs: [build, universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gotorrent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
