name: Release

# 推送 v* 标签即触发多架构交叉编译与 GitHub Release 发布。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, arch: amd64 }
          - { goos: linux, goarch: arm64, arch: arm64 }
          - { goos: linux, goarch: "386", arch: "386" }
          - { goos: linux, goarch: arm, goarm: "7", arch: armv7 }
          - { goos: linux, goarch: arm, goarm: "6", arch: armv6 }
          - { goos: windows, goarch: amd64, arch: amd64 }
          - { goos: windows, goarch: "386", arch: "386" }
          - { goos: windows, goarch: arm64, arch: arm64 }
          - { goos: darwin, goarch: amd64, arch: amd64 }
          - { goos: darwin, goarch: arm64, arch: arm64 }
          - { goos: freebsd, goarch: amd64, arch: amd64 }
          - { goos: freebsd, goarch: arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 交叉编译并打包
        id: pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NAME="gotorrent_${VERSION}_${GOOS}_${{ matrix.arch }}"
          STAGE="staging/${NAME}"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"

          mkdir -p "$STAGE"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${STAGE}/gotorrent${EXT}" .
          cp README.md "$STAGE/"

          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd staging && zip -qr "../dist/${NAME}.zip" "$NAME")
            echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "dist/${NAME}.tar.gz" -C staging "$NAME"
            echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gotorrent-${{ matrix.goos }}-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256 校验文件
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gotorrent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
